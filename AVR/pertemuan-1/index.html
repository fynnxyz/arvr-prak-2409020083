<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Praktikum 1 - Ruang Perkenalan Diri (AR/VR)</title>
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>
<body>
<a-scene>
  <!-- Lampu & Langit -->
  <a-sky color="#1b1f2a"></a-sky>
  <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
  <a-light type="directional" color="#ffffff" intensity="1.2" position="2 4 2"></a-light>

  <!-- Teks Perkenalan Diri -->
  <a-text value="Fanny Fhadillah - 2409020083" position="0 2.5 -3" align="center" color="#ffffff" width="6"></a-text>

  <!-- Objek Primitif 1: Box Berputar (Animasi) -->
  <a-box position="-1 1 -3" rotation="0 45 0" color="#4CC3D9"
         animation="property: rotation; to: 0 405 0; loop: true; dur: 6000; easing: linear">
  </a-box>

  <!-- Objek Primitif 2: Sphere -->
  <a-sphere position="0 1 -4" radius="0.8" color="#EF2D5E"></a-sphere>

  <!-- Objek Primitif 3: Cylinder -->
  <a-cylinder position="1 1 -3" radius="0.5" height="1.2" color="#FFC65D"></a-cylinder>

  <!-- Objek Primitif 4: Torus (Bonus) -->
  <a-torus position="0 0.2 -2.5" rotation="90 0 0" radius="0.4" radius-tubular="0.05" color="#9b59b6"></a-torus>

  <!-- Lantai -->
  <a-plane position="0 0 -3" rotation="-90 0 0" width="8" height="8" color="#7BC8A4"></a-plane>
</a-scene>
</body>
</html>
