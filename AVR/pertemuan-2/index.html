<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Kelompok - Minggu 2 Scene v1</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0; overflow:hidden">
<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false">
  <!-- Pencahayaan -->
  <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
  <a-light type="directional" color="#ffffff" intensity="0.8" position="1 3 2"></a-light>
  <a-light type="point" color="#ff5a5a" intensity="0.3" position="0 1 0"></a-light>

  <a-marker preset="hiro">
    <!-- Alas -->
    <a-plane id="alas-scene" position="0 0 0" rotation="-90 0 0" width="2" height="2" color="#e9e5fa" opacity="0.7" transparent="true"></a-plane>

    <!-- Semua objek dikelompokkan dalam entity induk -->
    <a-entity id="kelompok-objek" position="0 0 0">
      <!-- Objek 1: Kubus -->
      <a-box id="kubus-biru" position="-0.6 0.25 0" width="0.5" height="0.5" depth="0.5" color="#4C6EF5" rotation="0 25 0"></a-box>

      <!-- Objek 2: Bola dengan material -->
      <a-sphere id="bola-oranye" position="0 0.3 0" radius="0.3" color="#D9531E" metalness="0.3" roughness="0.4"></a-sphere>

      <!-- Objek 3: Silinder animasi -->
      <a-cylinder id="silinder-hijau" position="0.6 0.3 0" radius="0.2" height="0.6" color="#0B7F73"
        animation="property: rotation; to: 0 360 0; dur: 4000; loop: true; easing: linear"></a-cylinder>

      <!-- Objek 4: Kotak bertekstur; fallback warna jika aset belum ada -->
      <a-box id="kotak-tekstur" position="0 0.15 0.7" width="0.3" height="0.3" depth="0.3" color="#8e44ad" material="src: url(assets/tekstur.jpg); roughness: 0.8"></a-box>
    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>
</body>
</html>
